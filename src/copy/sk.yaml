# All Slovak text of the site, in page order. Edit the words; leave the keys.
#
#   {name}          a number or name the build fills in (from the chart data)
#   [text](url)     a link
#   |               starts a paragraph that runs over several lines
#
# Longer texts are Markdown files in src/content/:
#   zdroje/    the reading list on /zdroje/, one file per source
#   otazky/    questions and answers on /otazky/, one file per question
#   stranky/   the pages /bezpecnost/ and /kto-sme/

site:
  name: PauseAI Slovensko
  title: PauseAI Slovensko — Za bezpečnú a demokratickú budúcnosť umelej inteligencie
  description: >-
    Občianska iniciatíva za dočasné pozastavenie nekontrolovaných pretekov vo vývoji
    najnebezpečnejších AI systémov a za medzinárodný dohľad.
  email: info@pauseai.sk
  skip: Preskočiť na obsah
  logo_label: PauseAI Slovensko, domovská stránka

