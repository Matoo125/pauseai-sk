    Ľudia na zhromaždení PauseAI držia oranžové transparenty so symbolom pauzy a nápismi proti
    nekontrolovanému vývoju AI.

# The evidence section of the landing page: one chart, what the Slovak public thinks, and a quote.
home_evidence:
  heading: Čo hovoria dáta
  intro: >-
    Nemusíš nám veriť na slovo. Toto sú verejné merania a prieskumy, z ktorých vychádzame.
    Pri každom grafe je zdroj a tabuľka s hodnotami, aby sa dal overiť.
  more: >-
    Všetky tvrdenia s grafmi, so zdrojmi a s tým, čo dáta neukazujú, nájdeš na stránke
    [Informácie](/informacie/).
  public:
    heading: Čo si myslí slovenská verejnosť
    figures:
      - figure: 89 %
        text: >-
          ľudí na Slovensku súhlasí, že roboty a umelá inteligencia sú technológie, ktoré si
          vyžadujú starostlivé riadenie. Priemer Európskej únie je 84 %.
      - figure: 79 %
        text: >-
          si myslí, že pre roboty a umelú inteligenciu zanikne viac pracovných miest, než vznikne.
          Priemer Európskej únie je 66 %.
    source: >-
      [Špeciálny Eurobarometer 554](https://www.cec-managers.org/wp-content/uploads/2025/02/Artificial-Intelligence-and-the-future-of-work_SP554_factsheet_sk_en.pdf),
      1 023 respondentov na Slovensku, jar 2024. Prieskum sa pýtal na AI a roboty v práci,
      nie na pozastavenie vývoja.
  # Our translation of the Center for AI Safety statement. Original:
  # "Mitigating the risk of extinction from AI should be a global priority alongside other
  # societal-scale risks such as pandemics and nuclear war."
  quote: >-
    „Zmiernenie rizika vyhynutia v dôsledku AI by malo byť globálnou prioritou popri iných
    rizikách celospoločenského rozsahu, akými sú pandémie a jadrová vojna.“
  quote_source: >-
    [Vyhlásenie o riziku AI](https://www.safe.ai/work/statement-on-ai-risk), Center for AI Safety,
    máj 2023 (náš preklad). Podpísali ho okrem iných Geoffrey Hinton, Yoshua Bengio,
    Demis Hassabis a Sam Altman.

evidence_page:
  heading: Informácie
  lead: >-
    Tvrdenia, o ktoré opierame požiadavky. Pri každom je graf alebo údaj, zdroje
    a tiež to, čo z dát nevyplýva.
  description: Dáta, prieskumy a správy, o ktoré sa opiera PauseAI Slovensko, usporiadané podľa tvrdení.
  contents: Na tejto stránke
  sources: "Zdroje:"
  video_play: Prehrať video
  video_note: Video sa načíta z YouTube až po kliknutí.
  tabs_label: Grafy
  reading:
    heading: Na čítanie
    intro: >-
      Dlhšie texty pre tých, ktorí chcú ísť do hĺbky. Pri každom píšeme, čo tvrdí.
      Vedecký prehľad je niečo iné než argument jedného tímu, preto ich rozlišujeme.
    kinds:
      report: Vedecký prehľad
      argument: Argument
      book: Kniha
    open: Otvoriť
    disagree: >-
      Autori sa nezhodnú na tom, ako by k najhoršiemu došlo. Yudkowsky a Soares opisujú náhlu
      stratu kontroly, autori štúdie o postupnej strate vplyvu tvrdia, že žiadny taký okamih
      netreba, a Tegmark opisuje celú škálu možných budúcností. Zhodnú sa na jednom: dnes nevieme
      zaručiť, že systémy schopnejšie než ľudia zostanú pod ľudskou kontrolou.

# Text of the charts. Shared lines first, then one block per chart.
charts:
  source_line: "Zdroj: [{name}]({url}), {licence}, stav k {date}."
  table_summary: Zobraziť ako tabuľku
  model: Model
  org: Organizácia
  date: Zverejnené
  year: Rok
  total: Spolu
  score: Úspešnosť
  # Legend of the three test charts (FrontierMath, GPQA Diamond, Humanity's Last Exam).
  legend_record: najlepší výsledok v čase vydania
  legend_other: ostatné modely

  horizon:
    tab: Dĺžka úloh
    # {first}/{last} = durations like '3 s' and '17 h'   {first_year} = year   {months} = number
    title: AI dnes sama dokončí úlohy, ktoré odborníkovi trvajú {last}. V roku {first_year} to bolo {first}
    subtitle: >-
      Dĺžka softvérových úloh, ktoré model dokončí s 50 % úspešnosťou, meraná časom, ktorý na ne
      potrebuje odborník.
    # The landing page draws this chart with a linear axis, /informacie/ with a logarithmic one.
    axis_log: Zvislá os je logaritmická.
    axis_linear: Zvislá os je lineárna.
    legend_record: najlepší výsledok v čase vydania
    legend_other: ostatné modely
    note: >-
      Rekord sa zdvojnásobuje v priemere každých {months} mesiacov (vlastný výpočet z prvej
      a poslednej hodnoty). Merania: [METR]({metr_url}).
    aria: >-
      Bodový graf: dĺžka úloh, ktoré modely AI dokončia s 50 % úspešnosťou, podľa dátumu vydania.
      Rekord vzrástol z {first} v roku {first_year} na {last} ({model}). Hodnoty sú v tabuľke pod grafom.
    value: Dĺžka úlohy

  compute:
    tab: Tréningové výpočty
    # {growth} = '1,6 mld.'   {months} = '5'   {from}/{to} = years
    title: Najväčší tréning AI dnes spotrebuje približne {growth} ráz viac výpočtov než koncom roka 2012
    subtitle: >-
      Výpočty použité na tréning významných modelov AI, {from} – {to}.
      Zvislá os je logaritmická, v operáciách s pohyblivou rádovou čiarkou (FLOP).
    legend_record: rekord v čase zverejnenia
    legend_other: ostatné významné modely
    note: >-
      Rekord sa od konca roka 2012 zdvojnásobuje v priemere každých {months} mesiacov
      (vlastný výpočet z prvej a poslednej hodnoty). Niektoré hodnoty sú odhady. V tabuľke sú len
      rekordy; všetkých {count} modelov je v [pôvodnom súbore CSV]({csv}).
    aria: >-
      Bodový graf: tréningové výpočty významných modelov AI od roku {from}. Rekord vzrástol
      z {base} FLOP koncom roka 2012 na {latest} FLOP ({model}). Hodnoty sú v tabuľke pod grafom.
    value: Tréning (FLOP)
    confidence_label: Istota odhadu
    confidence:
      Confident: vysoká
      Likely: stredná
      Speculative: nízka
      unknown: neuvedená

  cybench:
    tab: Hackerské úlohy
    # {first_year} = earliest year in the data   {first}/{last} = percentages   {model} = latest record
    title: V roku {first_year} vyriešil najlepší model {first} % hackerských úloh. Najnovší výsledok je {last} %
    subtitle: >-
      Podiel úloh z testu Cybench, ktoré model vyriešil bez nápovede. Cybench tvorí 40 úloh
      z profesionálnych súťaží capture the flag.
    legend_record: najlepší výsledok v čase vydania
    legend_other: ostatné modely
    note: >-
      Časť výsledkov vrátane najvyšších uvádzajú vývojári vo vlastnej dokumentácii k modelom;
      pôvod každého čísla je v tabuľke.
    aria: >-
      Bodový graf: podiel úloh testu Cybench vyriešených modelmi AI podľa dátumu vydania.
      Najlepší výsledok vzrástol z {first} % v roku {first_year} na {last} % ({model}).
      Hodnoty sú v tabuľke pod grafom.
    value: Vyriešené úlohy
    reported: Výsledok uvádza

  # The three test charts: {first_year} = earliest year in the data, {first} = best score by the
  # end of that year, {last} = best score today, {model} = the model that holds it.
  frontiermath:
    tab: Matematika
    title: Koncom roka {first_year} vyriešila AI {first} % náročných matematických úloh FrontierMath. Dnes {last} %
    subtitle: >-
      Podiel vyriešených úloh z testu FrontierMath (úrovne 1 až 3). Úlohy zostavili matematici
      a ich zadania nie sú verejné, aby sa ich modely nemohli naučiť naspamäť.
    note: >-
      Výsledky meria Epoch AI sám. Vznik testu financovala firma OpenAI, ktorá má prístup k časti
      úloh.
    aria: >-
      Bodový graf: podiel vyriešených úloh testu FrontierMath podľa dátumu vydania modelu.
      Najlepší výsledok vzrástol z {first} % v roku {first_year} na {last} % ({model}).
      Hodnoty sú v tabuľke pod grafom.

  gpqa:
    tab: Vedecké otázky
    title: V roku {first_year} odpovedala AI správne na {first} % odborných otázok z prírodných vied. Dnes na {last} %
    subtitle: >-
      Podiel správnych odpovedí v teste GPQA Diamond: 198 otázok z biológie, fyziky a chémie,
      každá so štyrmi možnosťami. Otázky sú navrhnuté tak, aby sa odpoveď nedala jednoducho
      vyhľadať na internete.
    reference:
      value: 69.7
      label: odborníci s doktorátom (69,7 %)
    note: >-
      Hodnotu 69,7 % namerala OpenAI na odborníkoch s doktorátom, ktorých na test najala
      ([Epoch AI]({url})). Náhodným tipovaním by model dosiahol 25 %.
    aria: >-
      Bodový graf: podiel správnych odpovedí v teste GPQA Diamond podľa dátumu vydania modelu.
      Najlepší výsledok vzrástol z {first} % v roku {first_year} na {last} % ({model}), odborníci
      s doktorátom dosiahli 69,7 %. Hodnoty sú v tabuľke pod grafom.

  hle:
    tab: Posledná skúška
    title: V roku {first_year} zvládla AI {first} % otázok testu Humanity's Last Exam. Dnes {last} %
    subtitle: >-
      Podiel správnych odpovedí v teste Humanity's Last Exam („Posledná skúška ľudstva“).
      Otázky z desiatok odborov zostavili odborníci a ponechali tie, na ktoré najlepšie modely
      v čase vzniku testu (2024 – 2025) nevedeli odpovedať.
    note: >-
      Výsledky uvádzajú [autori testu]({url}) a vývojári modelov, Epoch AI ich zbiera. Staršie modely boli
      testované až po ich vydaní.
    aria: >-
      Bodový graf: podiel správnych odpovedí v teste Humanity's Last Exam podľa dátumu vydania
      modelu. Najlepší výsledok vzrástol z {first} % v roku {first_year} na {last} % ({model}).
      Hodnoty sú v tabuľke pod grafom.

  sectors:
    tab: Kto modely zverejňuje
    # {share_last}/{share_first} = whole percentages   {last}/{first} = years
    title: V roku {last} prišlo {share_last} % významných modelov z firiem. V roku {first} to bolo {share_first} %
    subtitle: Počet významných modelov AI zverejnených za rok, podľa typu organizácie.
    note: Zaradenie organizácií je podľa Epoch AI.
    aria: >-
      Stĺpcový graf: počet významných modelov AI za rok podľa typu organizácie, {first} až {last}.
      Podiel firiem vzrástol z {share_first} % na {share_last} %. Hodnoty sú v tabuľke pod grafom.
    series:
      industry: Firmy
      mixed: Firmy spolu s univerzitami
      academia: Univerzity
      other: Iné

  investment:
    tab: Investície
    # {last_value}/{first_value} = billions of dollars   {last}/{first} = years
    title: Do súkromných AI firiem prišlo v roku {last} približne {last_value} mld. dolárov. V roku {first} to bolo {first_value} mld.
    subtitle: Súkromné investície do firiem vyvíjajúcich AI vo svete, v miliardách dolárov (v cenách roku 2021).
    note: >-
      Nezahŕňa firmy obchodované na burze ani vlastné výdavky firiem na výskum a dátové centrá,
      takže skutočné sumy sú vyššie.
    aria: >-
      Stĺpcový graf: súkromné investície do AI firiem vo svete za rok, {first} až {last}.
      Vzrástli z {first_value} na {last_value} miliárd dolárov. Hodnoty sú v tabuľke pod grafom.
    value: Investície (mld. USD)
    unit: mld. $

demands:
  heading: Tri kroky pre bezpečnú budúcnosť
  intro: Žiadnu z týchto požiadaviek sme nevymysleli. Pri každej uvádzame, kto ju navrhuje.
  more: Námietky, ktoré počúvame najčastejšie, rozoberáme v [otázkach a odpovediach](/otazky/).
  # `basis` says who proposes the demand; keep the links.
  items:
    - title: Medzinárodná agentúra pre dohľad nad AI
      text: >-
        Podľa vzoru Medzinárodnej agentúry pre atómovú energiu (IAEA) potrebujeme nezávislý globálny
        orgán, ktorý audituje dátové centrá a sleduje tréning modelov na hranici schopností.
      basis: >-
        Orgán podobný IAEA navrhlo v roku 2023 vedenie OpenAI v texte
        [Governance of superintelligence](https://openai.com/index/governance-of-superintelligence/)
        a myšlienku verejne podporil generálny tajomník OSN António Guterres. Podrobný návrh má
        [PauseAI](https://pauseai.info/proposal).
    - title: Podmienka garantovanej bezpečnosti
      text: >-
        Vývoj a trénovanie novej generácie superinteligentných modelov musia byť pozastavené, kým
        vedecká komunita nepreukáže spoľahlivé metódy zarovnania (alignment) a kontroly.
      basis: >-
        Zákaz vývoja superinteligencie, kým nebude vedecký konsenzus, že je bezpečná a ovládateľná,
        žiada [Statement on Superintelligence](https://superintelligence-statement.org/) (2025).
        Pozastavenie tréningu žiadal už otvorený list
        [Pause Giant AI Experiments](https://futureoflife.org/open-letter/pause-giant-ai-experiments/) (2023)
        a žiada ho [vyhlásenie PauseAI](https://pauseai.info/statement).
    - title: Demokratická kontrola a certifikácia
      text: >-
        Nasadenie modelov do kritickej infraštruktúry a verejného priestoru musí podliehať
        verejnému posúdeniu dopadov na prácu, demokraciu a bezpečnosť občanov.
      basis: >-
        Posudzovanie rizikových systémov pred uvedením na trh už zavádza európsky
        [AI Act](https://eur-lex.europa.eu/eli/reg/2024/1689/oj). Licencie a nezávislé audity pre
        najvýkonnejšie systémy navrhujú Yoshua Bengio, Geoffrey Hinton a ďalší v článku
        [Managing extreme AI risks amid rapid progress](https://www.science.org/doi/10.1126/science.adn0117) (Science, 2024).

join:
  heading: Pridaj sa k PauseAI Slovensko
  text: >-
    Nechaj nám kontakt. Dáme ti vedieť o akciách, kampaniach a možnostiach, ako sa zapojiť
    na Slovensku.
  contact: >-
    Kontakty z formulára dostáva tím slovenských koordinátorov. Ak formulár nefunguje alebo nám
    chceš napísať priamo, [pošli nám e-mail](mailto:info@pauseai.sk).

  statement:
    heading: Podpíš medzinárodné vyhlásenie
    text: >-
      Hnutie PauseAI vyzýva vlády sveta, aby uzavreli medzinárodnú zmluvu o pozastavení tréningu
      najvýkonnejších všeobecných systémov AI, kým nebudeme vedieť, ako ich vytvárať bezpečne
      a udržať pod demokratickou kontrolou. Podpisuje sa priamo na stránke hnutia.
    button: Podpísať na pauseai.info
    url: https://pauseai.info/statement
    also: >-
      Podobnú výzvu, [Statement on Superintelligence](https://superintelligence-statement.org/),
      podpísali desaťtisíce ľudí vrátane popredných vedcov.

  form:
    heading: Zostaňme v kontakte
    intro: Zaberie to menej než 30 sekúnd a k ničomu ťa to nezaväzuje.
    name: Meno a priezvisko
    name_placeholder: napr. Mária Horváthová
    email: E-mailová adresa
    email_placeholder: tvoj@email.sk
    role: Mesto alebo zameranie (voliteľné)
    role_placeholder: napr. Bratislava / študent, rodič, IT
    volunteer: Mám záujem pomôcť ako dobrovoľník alebo sa zapojiť do lokálnych aktivít na Slovensku.
    button: Pridať sa
    sending: Odosielam…
    done: Kontakt odoslaný
    # {name} = what the person typed
    success: Ďakujeme, {name}! Ozveme sa ti.
    success_volunteer: Ďakujeme, {name}! Ozveme sa ti s možnosťami, ako pomôcť.
    error: Kontakt sa nepodarilo odoslať. Skús to znova alebo nám napíš na info@pauseai.sk.
    privacy: >-
      Žiadny spam. Údaje použijeme len na to, aby sme ti písali o aktivitách PauseAI Slovensko.
      O ich vymazanie môžeš kedykoľvek požiadať na info@pauseai.sk.
    # Subject of the e-mail the coordinators receive.
    mail_subject: Nový záujemca – PauseAI Slovensko

questions:
  heading: Otázky a námietky
  lead: >-
    Námietky, ktoré počúvame najčastejšie, a naše odpovede na ne. Kde sa dá, odkazujeme na zdroj,
    aby sa odpoveď dala overiť.
  description: Najčastejšie námietky proti pozastaveniu vývoja najvýkonnejšej AI a odpovede PauseAI Slovensko.
  missing: Chýba ti tu otázka? Napíš nám na [info@pauseai.sk](mailto:info@pauseai.sk).

