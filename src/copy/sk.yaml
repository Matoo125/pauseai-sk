  description: >-
    Občianska iniciatíva za dočasné pozastavenie nekontrolovaných pretekov vo vývoji
    najnebezpečnejších AI systémov a za medzinárodný dohľad.
  email: info@pauseai.sk
  skip: Preskočiť na obsah
  logo_label: PauseAI Slovensko, domovská stránka

nav:
  label: Hlavná navigácia
  evidence: Informácie
  questions: Otázky
  about: Kto sme
  join: Pridať sa

hero:
  title:
    - Budúcnosť tvoríme my.
    - Nie nekontrolované preteky algoritmov.
  lead: >-
    PauseAI Slovensko spája vedcov, vývojárov, rodičov a občanov, ktorí žiadajú zodpovedné tempo,
    medzinárodný bezpečnostný dohľad a demokratickú kontrolu skôr, než sa začnú trénovať najsilnejšie modely.
  cta: Pridať sa
  cta_data: Pozrieť dáta
