# All short Slovak text of the site. Edit the words; leave the keys.
#
#   {name}          a number or name the build fills in (from the chart data)
#   [text](url)     a link
#   >-              starts a paragraph that runs over several lines
#
# Longer texts are Markdown files in src/content/:
#   tvrdenia/   the claims on /informacie/, one file per claim
#   otazky/     questions and answers on /otazky/, one file per question
#   zdroje/     the reading list at the end of /informacie/, one file per book or report
#   stranky/    the page /kto-sme/

